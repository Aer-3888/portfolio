name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache CV build
        uses: actions/cache@v4
        with:
          path: |
            public/cv.pdf
            public/cv_en.pdf
            cv/*.aux
            cv/*.log
          key: cv-${{ hashFiles('cv/cv.tex', 'cv/cv_en.tex') }}

      - name: Compile CV (FR)
        if: hashFiles('public/cv.pdf') == ''
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv/cv.tex
          working_directory: .
          args: -output-directory=public

      - name: Compile CV (EN)
        if: hashFiles('public/cv_en.pdf') == ''
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv/cv_en.tex
          working_directory: .
          args: -output-directory=public

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

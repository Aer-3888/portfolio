name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile CV (FR)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          working_directory: cv

      - name: Compile CV (EN)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv_en.tex
          working_directory: cv

      - name: Compile CV (Google)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume_phan_theo.tex
          working_directory: cv/Google

      - name: Move CVs to public
        run: |
          cp cv/cv.pdf public/cv.pdf
          cp cv/cv_en.pdf public/cv_en.pdf
          mkdir -p public/2ee313c6de7e1c7f30c97bf2e0dd2759
          cp cv/Google/resume_phan_theo.pdf public/2ee313c6de7e1c7f30c97bf2e0dd2759/resume_phan_theo.pdf

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: portfolio-theo
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Théo Phan | Portfolio</title>
    <meta name="description" content="Théo Phan — CS student at INSA Rennes specializing in AI Engineering and Full-Stack development. Portfolio showcasing web, mobile, and computer vision projects." />
    <meta name="author" content="Théo Phan" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://aer-3888.github.io/portfolio/" />

    <!-- Preload the LCP hero image so it is discoverable before React mounts -->
    <link rel="preload" as="image" href="/images/optimized/me_.webp" fetchpriority="high" />

    <!-- Inter font, loaded without blocking first render -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Open Graph -->
    <meta property="og:title" content="Théo Phan | Portfolio" />
    <meta property="og:description" content="CS student at INSA Rennes — AI Engineering & Full-Stack Development" />
    <meta property="og:image" content="https://aer-3888.github.io/portfolio/images/og-preview.png" />
    <meta property="og:url" content="https://aer-3888.github.io/portfolio/" />
    <meta property="og:type" content="website" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Théo Phan | Portfolio" />
    <meta name="twitter:description" content="CS student at INSA Rennes — AI Engineering & Full-Stack Development" />
    <meta name="twitter:image" content="https://aer-3888.github.io/portfolio/images/og-preview.png" />
    <script>
      // Handle SPA redirects from 404.html
      (function() {
        var q = window.location.search;
        if (q && q.indexOf('?p=') === 0) {
          var path = decodeURIComponent(q.slice(3));
          window.history.replaceState(null, '', path);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

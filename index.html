<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Théo Phan | Software that escapes the screen</title>
    <meta
      name="description"
      content="Théo Phan is a computer-science engineer building at the intersection of AI, mobile, security, hardware, and the real world."
    />
    <meta name="author" content="Théo Phan" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://aerworks.net/" />

    <!-- Preload the LCP hero image so it is discoverable before React mounts -->
    <link rel="preload" as="image" href="/images/optimized/me_.webp" fetchpriority="high" />

    <!-- Fonts (Inter body, Instrument Serif display, Space Mono labels), loaded without blocking first render -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Open Graph -->
    <meta property="og:title" content="Théo Phan | Software that escapes the screen" />
    <meta property="og:description" content="AI, mobile, security, hardware, and the real world." />
    <meta property="og:image" content="https://aerworks.net/og-preview.png" />
    <meta property="og:url" content="https://aerworks.net/" />
    <meta property="og:type" content="website" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Théo Phan | Software that escapes the screen" />
    <meta
      name="twitter:description"
      content="AI, mobile, security, hardware, and the real world."
    />
    <meta name="twitter:image" content="https://aerworks.net/og-preview.png" />

    <!-- Structured data: personal identity for name searches -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Théo Phan",
        "url": "https://aerworks.net/",
        "image": "https://aerworks.net/og-preview.png",
        "jobTitle": "Computer Science Student",
        "affiliation": { "@type": "CollegeOrUniversity", "name": "INSA Rennes" },
        "sameAs": [
          "https://github.com/Aer-3888",
          "https://www.linkedin.com/in/theophanquochuy/",
          "https://www.instagram.com/phan.theo.huy/"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
